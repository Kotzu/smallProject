name: Deploy WoW PvP Simulator
on:
  push:
    branches: [main]
    paths:
      - 'wow-pvp-sim/**'
      - '.github/workflows/wow-pvp-sim-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload simulator
        uses: actions/upload-pages-artifact@v4
        with:
          path: wow-pvp-sim
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
