[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perfect-assassin"
version = "0.1.0"
description = "Observe-only foundation for the Perfect Assassin Rogue Predator"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "jsonschema-rs==0.50.1",
  "numpy==2.5.2",
]

[project.scripts]
perfect-assassin = "perfect_assassin.cli:main"

[project.optional-dependencies]
control-center = ["Pillow==12.3.0"]
stay-online = ["psutil==7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perfect_assassin = ["py.typed"]
